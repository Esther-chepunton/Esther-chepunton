<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Esther Chepunton — Solo founder, Korava Group, Nairobi">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F4F1EA" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0B0C" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0B0B0C" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:'Geist',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .blink{animation:b 1.1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
    .spin{transform-origin:1010px 160px;animation:s 40s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>

  <rect width="1200" height="320" fill="#0B0B0C"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- frame + registration marks -->
  <rect x="24.5" y="24.5" width="1151" height="271" fill="none" stroke="#F4F1EA" stroke-opacity="0.12"/>
  <g stroke="#C8551E" stroke-width="2" fill="none">
    <path d="M24 44V24H44"/><path d="M1156 24H1176V44"/>
    <path d="M24 276V296H44"/><path d="M1176 276V296H1156"/>
  </g>

  <!-- mechanical dial -->
  <g class="spin" fill="none" stroke="#F4F1EA">
    <circle cx="1010" cy="160" r="96" stroke-opacity="0.14"/>
    <circle cx="1010" cy="160" r="70" stroke-opacity="0.08" stroke-dasharray="2 6"/>
    <g stroke-opacity="0.35">
      <path d="M1010 58v12M1010 250v12M908 160h12M1100 160h12"/>
    </g>
    <path d="M1010 64a96 96 0 0 1 83 48" stroke="#C8551E" stroke-width="2" stroke-opacity="1"/>
  </g>
  <circle cx="1010" cy="160" r="4" fill="#C8551E"/>
  <rect width="1200" height="320" fill="url(#fade)"/>

  <!-- index line -->
  <text x="64" y="76" class="mono" font-size="13" letter-spacing="3" fill="#F4F1EA" fill-opacity="0.45">SYS / 00 — NAIROBI, KE — 1.29°S 36.82°E</text>

  <!-- name -->
  <text x="62" y="150" class="sans" font-size="64" font-weight="600" letter-spacing="-1.5" fill="#F4F1EA">Esther Chepunton</text>

  <!-- role -->
  <text x="64" y="194" class="mono" font-size="18" fill="#F4F1EA" fill-opacity="0.75">Solo founder<tspan dx="10" fill="#C8551E">/</tspan><tspan dx="10">Korava Group</tspan><tspan dx="10" fill="#C8551E">/</tspan><tspan dx="10">Animated web experiences</tspan></text>

  <!-- prompt -->
  <text x="64" y="252" class="mono" font-size="15" fill="#F4F1EA" fill-opacity="0.55"><tspan fill="#C8551E">~$</tspan> build → note → ship → reflect</text>
  <rect x="362" y="239" width="9" height="17" fill="#C8551E" class="blink"/>
</svg>
