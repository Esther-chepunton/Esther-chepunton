<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Hi, I'm Esther — full-stack software developer in Nairobi">
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B9A6F2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B9A6F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F29A6B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F29A6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FD3C1" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8FD3C1" stop-opacity="0"/>
    </radialGradient>
    <path id="trail" d="M760 300 L840 236 L880 262 L960 176 L1010 222 L1060 190 L1150 300"/>
  </defs>
  <style>
    .sans{font-family:'Geist',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .float1{animation:f1 9s ease-in-out infinite}
    .float2{animation:f2 12s ease-in-out infinite}
    .float3{animation:f1 14s ease-in-out infinite reverse}
    @keyframes f1{50%{transform:translate(18px,-14px)}}
    @keyframes f2{50%{transform:translate(-22px,12px)}}
    .tw{animation:tw 3s ease-in-out infinite}
    .d1{animation-delay:.6s}.d2{animation-delay:1.3s}.d3{animation-delay:2s}.d4{animation-delay:2.6s}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    .wave{transform-origin:452px 118px;animation:wave 2.4s ease-in-out infinite}
    @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
    .role{opacity:0;animation:role 16s infinite}
    .r2{animation-delay:4s}.r3{animation-delay:8s}.r4{animation-delay:12s}
    @keyframes role{0%{opacity:0;transform:translateY(8px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
    .blink{animation:b 1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
  </style>

  <rect width="1200" height="340" rx="20" fill="#0E0D12"/>

  <!-- dreamy blobs -->
  <circle class="float1" cx="980" cy="90" r="190" fill="url(#glowA)"/>
  <circle class="float2" cx="140" cy="300" r="170" fill="url(#glowB)"/>
  <circle class="float3" cx="640" cy="40" r="140" fill="url(#glowC)"/>

  <!-- twinkling stars -->
  <g fill="#F6F1E9">
    <path class="tw" d="M690 70l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
    <path class="tw d2" d="M1120 60l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <path class="tw d3" d="M560 260l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <circle class="tw d1" cx="880" cy="120" r="2"/>
    <circle class="tw d4" cx="1040" cy="140" r="1.6"/>
    <circle class="tw d2" cx="740" cy="160" r="1.4"/>
    <circle class="tw d3" cx="1150" cy="170" r="2"/>
    <circle class="tw" cx="610" cy="120" r="1.4"/>
  </g>

  <!-- moon -->
  <g transform="translate(1090 92)">
    <circle r="22" fill="#F6F1E9"/>
    <circle cx="9" cy="-6" r="20" fill="#0E0D12"/>
  </g>

  <!-- mountain trail with a tiny hiker -->
  <use href="#trail" fill="none" stroke="#F6F1E9" stroke-opacity="0.25" stroke-width="2" stroke-linejoin="round"/>
  <use href="#trail" fill="none" stroke="#F29A6B" stroke-width="2" stroke-dasharray="3 9" stroke-linejoin="round"/>
  <path d="M960 176v-26l18 7-18 7" fill="#F29A6B"/>
  <circle r="5" fill="#B9A6F2">
    <animateMotion dur="14s" repeatCount="indefinite" rotate="0"><mpath href="#trail"/></animateMotion>
  </circle>

  <!-- greeting -->
  <text x="64" y="132" class="sans" font-size="58" font-weight="600" letter-spacing="-1.2" fill="#F6F1E9">hi, I'm Esther</text>
  <text x="428" y="128" font-size="50" class="wave">👋</text>

  <text x="66" y="180" class="mono" font-size="19" fill="#F6F1E9" fill-opacity="0.8">full-stack software developer <tspan fill="#F29A6B">✦</tspan> Nairobi, Kenya</text>

  <!-- rotating roles -->
  <g class="mono" font-size="17">
    <text x="66" y="250" fill="#F6F1E9" fill-opacity="0.55"><tspan fill="#8FD3C1">~$</tspan> esther</text>
    <text x="172" y="250" class="role" fill="#B9A6F2">--builds full-stack web apps</text>
    <text x="172" y="250" class="role r2" fill="#F29A6B">--ships with Next.js + Django</text>
    <text x="172" y="250" class="role r3" fill="#8FD3C1">--is learning 3D on the web</text>
    <text x="172" y="250" class="role r4" fill="#F6F1E9">--takes the long way up the mountain</text>
  </g>
</svg>
