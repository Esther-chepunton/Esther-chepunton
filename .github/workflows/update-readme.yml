name: Sync field notes into profile

on:
  schedule:
    - cron: "17 4 * * *"      # daily, 07:17 Nairobi
  workflow_dispatch:           # "Run workflow" button
  repository_dispatch:
    types: [notes-updated]     # pinged by the field-notes repo on every push

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out field-notes (full history for note dates)
        uses: actions/checkout@v4
        with:
          repository: Esther-chepunton/field-notes
          path: .field-notes
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite README
        run: python scripts/update_readme.py .field-notes README.md

      - name: Commit if notes changed
        run: |
          # ignore a change that is only the timestamp
          if git diff --quiet -I 'Last synced:' README.md; then
            echo "No new notes."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync latest field notes"
          git push
